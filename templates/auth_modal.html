<!-- Dark background behind popup -->
<div class="popup-overlay" id="authOverlay"></div>

<!-- ================= LOGIN POPUP ================= -->
<div class="auth-popup" id="loginPopup">
    <div class="auth-popup-box">
      <button type="button" class="popup-close" id="loginCloseBtn">&times;</button>
        <h2>Login</h2>

        <form id="loginForm">
          <div class="form-group">
                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" 
                name="email" placeholder="Enter your email" required >

                <span class="form-error" id="loginEmailError"></span>
            </div>
            
            <div class="form-group">
                <label for="loginPassword">Password</label>

                <div class="password-field">
                    <input type="password" id="loginPassword"
                      name="password" placeholder="Enter your password" required >
                    <button type="button" class="password-toggle" data-target="loginPassword"
                        aria-label="Show password" aria-pressed="false">
                        <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                            <line x1="1" y1="1" x2="23" y2="23"/>
                        </svg>
                    </button>
                </div>

                <span class="form-error" id="loginPasswordError"></span>
            </div>


            <button type="submit" class="auth-button">Login</button>
        </form>


        <p class="auth-switch">
            Don't have an account?
            <button type="button" class="switch-button" id="showRegisterBtn">
            Register</button>
        </p>
      </div>
</div>

<!-- ================= REGISTER POPUP ================= -->
<div class="auth-popup" id="registerPopup">
    <div class="auth-popup-box">
        <button type="button"  class="popup-close" id="registerCloseBtn">
        &times; </button>

        <h2>Create Account</h2>
        <form id="registerForm">
          <div class="form-group">
                <label for="registerUsername">Username</label>

                <input type="text"  id="registerUsername"
                  name="username" placeholder="Choose a username" required >

                <span class="form-error" id="registerUsernameError"></span>
            </div>

            <div class="form-group">
                <label for="registerEmail">Email</label>
                <input
                    type="email"
                    id="registerEmail"
                    name="email"
                    placeholder="Enter your email"
                    required>
                <span class="form-error" id="registerEmailError"></span>
            </div>

            <div class="form-group">
                <label for="registerPassword">Password</label>
                <div class="password-field">
                    <input
                        type="password"
                        id="registerPassword"
                        name="password"
                        placeholder="Create a password"
                        required>
                    <button type="button" class="password-toggle" data-target="registerPassword"
                        aria-label="Show password" aria-pressed="false">
                        <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                            <line x1="1" y1="1" x2="23" y2="23"/>
                        </svg>
                    </button>
                </div>
                <span class="form-error" id="registerPasswordError"></span>
            </div>


            <div class="form-group">
                <label for="registerConfirmPassword">
                    Confirm Password
                </label>

                <div class="password-field">
                    <input
                        type="password"
                        id="registerConfirmPassword"
                        name="confirm_password"
                        placeholder="Re-enter your password"
                        required >
                    <button type="button" class="password-toggle" data-target="registerConfirmPassword"
                        aria-label="Show password" aria-pressed="false">
                        <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                            <line x1="1" y1="1" x2="23" y2="23"/>
                        </svg>
                    </button>
                </div>
                <span class="form-error"id="registerConfirmPasswordError"></span>
            </div>
            <button type="submit" class="auth-button">Create Account</button>
        </form>

        <p class="auth-switch">
            Already have an account?
            <button type="button" class="switch-button" id="showLoginBtn">Login</button>
        </p>
    </div>
</div>
